# The channel itself: identity, the broadcast grid, and how far ahead to plan.
channel:
  name: "Adult Swim"
  number: "1"
  tvg_id: "adultswim.1"
  group: "Nostalgia"

  grid:
    # A real [as] launch date, so "day 0" has meaning.
    anchor: "2001-09-02"
    # Every slot boundary lands on :00/:15/:30/:45.
    quantum_minutes: 15
    # Japan Standard Time. The grid aligns to this wall clock, so it decides
    # what "23:30" means for you. JST has no DST, so every day is exactly 24h
    # and the DST branch in the grid builder never has to do anything.
    timezone: "Asia/Tokyo"

  # The wall-clock date that maps to the channel's "start". Leave commented to
  # use today, which is what you want on a live channel.
  # on_air_date: "2003-06-15"

  # The year the channel is pretending to be in. This is what decides which
  # commercials are eligible and what the generated bumps look like -- it must
  # NOT follow the wall clock, or a 2003 channel airs 2026's ads. Leave
  # commented to derive it from on_air_date, then bumps.generated.era_year.
  era_year: 2003

  # Plan this many days ahead. ErsatzTV Next picks up new files without a restart.
  horizon_days: 3

  # Which broadcast test pattern the web UI wears. NTSC is correct here: [adult
  # swim] was a US NTSC channel and Japan broadcast NTSC-J, the same 525/60
  # system. Set "pal" only for a PAL variant of the channel.
  test_card: ntsc

  # Optional: a logo shown in client guides.
  # logo: "https://example.invalid/adult-swim.png"

# Default encode. 720p/2.5 Mbps keeps a 24/7 transcode affordable; raise it if
# you have a GPU and want 1080p.
  logo: https://upload.wikimedia.org/wikipedia/commons/f/f7/Old_Adult_Swim_Logo.png
encoding:
  width: 1280
  height: 720
  bitrate_kbps: 2500
  audio_bitrate_kbps: 160

# Where media lives, relative to the project root.
media_root: "media"
